spring.application.name=api-alunos

# Conexão com o PostgreSQL (troque pelos dados da sua máquina)
spring.datasource.url=jdbc:postgresql://localhost:5432/alunos_db
spring.datasource.username=SEU_USUARIO
spring.datasource.password=SUA_SENHA

# update: o Hibernate cria/atualiza as tabelas sozinho ao iniciar a aplicação
spring.jpa.hibernate.ddl-auto=update

# mostra no console os comandos SQL que o Hibernate executa
spring.jpa.show-sql=true
